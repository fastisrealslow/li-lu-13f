name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # GITHUB_TOKEN pushes do not start push workflows. Publish after the updater.
  workflow_run:
    workflows: ["Update 13F Data", "AI Supplement (Qwen CPU)"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The updater commits data after its triggering SHA. Read the updated branch.
          ref: ${{ github.event_name == 'workflow_run' && 'master' || github.ref }}

      - name: Test investor data and display
        run: node --test tests/*.cjs

      - name: Test spin-off evidence and financial history
        run: |
          python3 -m unittest discover -s tests -p test_spinoff_events.py -v
          python3 -m unittest discover -s tests -p test_13f_units.py -v

      - name: Validate published data
        run: python3 validate_data.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
