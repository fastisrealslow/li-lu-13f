name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # GITHUB_TOKEN pushes do not start push workflows. Publish after the updater.
  workflow_run:
    workflows: ["Update 13F Data", "AI Supplement (Qwen CPU)", "Update Personal Portfolio", "Update Speech Archive"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # A failed updater can commit status ONLY. Always validate a fresh master
    # checkout; never deploy the failed job's working tree or its artifacts.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || (github.event.workflow_run.name == 'Update 13F Data' && github.event.workflow_run.conclusion == 'failure') }}
    # A skipped workflow_run must not cancel a real deployment in progress.
    concurrency:
      group: pages
      # Finish the active publication; coalesce later updates into one pending job.
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The updater commits data after its triggering SHA. Read the updated branch.
          ref: ${{ github.event_name == 'workflow_run' && 'master' || github.ref }}

      - name: Test investor data and display
        run: node --test tests/*.cjs

      - name: Install financial-report and archive source readers
        run: python3 -m pip install pymupdf==1.28.2 beautifulsoup4==4.14.2

      - name: Test spin-off evidence and financial history
        run: |
          python3 -m unittest discover -s tests -p test_spinoff_events.py -v
          python3 -m unittest discover -s tests -p test_security_identity.py -v
          python3 -m unittest discover -s tests -p test_cost_calculation.py -v
          python3 -m unittest discover -s tests -p test_13f_units.py -v
          python3 -m unittest discover -s tests -p test_quote_coverage.py -v
          python3 -m unittest discover -s tests -p test_magic_formula.py -v

      - name: Validate published data
        run: |
          python3 validate_data.py
          python3 quote_coverage.py --check

      - name: Validate speech and interview reading editions
        run: |
          python3 -m unittest discover -s tests -p test_speech_archive.py -v
          python3 -m unittest discover -s tests -p test_verbatim_texts.py -v
          python3 -m unittest discover -s tests -p test_archive_explanations.py -v
          python3 -m unittest discover -s tests -p test_archive_generator.py -v
          python3 -m unittest discover -s tests -p test_publisher_transcripts.py -v
          python3 speech_archive.py validate
          python3 archive_explanations.py validate

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build immutable browser snapshots and lazy history
        run: |
          python3 -m unittest discover -s tests -p test_browser_assets.py -v
          python3 build_browser_assets.py

      - name: Keep unreviewed AI drafts out of the published site
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          index=json.loads(Path('archive/explanations/index.json').read_text())
          approved={entry['file'] for entry in index['entries'].values() if entry.get('reviewStatus')=='verified'}
          for path in Path('archive/explanations').glob('*.json'):
            if path.name!='index.json' and path.as_posix() not in approved:path.unlink()
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
