name: Update Personal Portfolio

on:
  schedule:
    # Beijing 06:35, 12:15, 16:35; US open +45m guarded for DST.
    - cron: '35 22 * * *'
    - cron: '15 4 * * *'
    - cron: '35 8 * * *'
    - cron: '15 14 * * *'
    - cron: '15 15 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - market_schedule.py
      - .github/workflows/personal-portfolio.yml
      - update_personal_portfolio.py
      - publish_personal_portfolio.py
      - tests/test_personal_publication.py
      - personal_reports.py
      - magic_formula.py
      - personal_report_profiles.json
      - tests/test_magic_formula.py

permissions:
  contents: write

concurrency:
  group: personal-portfolio-master
  cancel-in-progress: false

jobs:
  timing:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.clock.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install exchange-calendars==4.13.3
      - id: clock
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python market_schedule.py --schedule "$EVENT_SCHEDULE"
  update:
    needs: timing
    if: needs.timing.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued runs must begin with the preceding updater's published data.
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remember calculation source
        run: echo "PERSONAL_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install report readers
        run: pip install exchange-calendars==4.13.3 pymupdf==1.28.2 beautifulsoup4==4.15.0 pdfminer.six==20260107
      - name: Select markets with fresh sessions
        id: markets
        run: python market_schedule.py
      - uses: actions/cache@v4
        with:
          path: .cache/personal-reports
          key: personal-reports-v1-${{ github.run_id }}
          restore-keys: personal-reports-v1-
      - name: Test financial calculations and report extraction
        run: |
          python -m unittest discover -s tests -p test_magic_formula.py -v
          python -m unittest discover -s tests -p test_personal_publication.py -v
      - name: Discover reports, verify inputs, update prices and recalculate
        run: if [ -n "$MARKET_REFRESH" ]; then
            python update_personal_portfolio.py --verify-reports
          else
            python update_personal_portfolio.py --verify-reports --no-quotes
          fi
      - name: Validate personal data before publishing
        run: |
          python -c "import json; from magic_formula import validate_dataset; validate_dataset(json.load(open('personal_portfolio.json')))"
          node --test tests/personal_portfolio.cjs
      - name: Commit updated portfolio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add personal_portfolio.json personal_report_profiles.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh report-backed personal portfolio calculations'
          python publish_personal_portfolio.py
