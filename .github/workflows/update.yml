name: Update 13F Data

on:
  schedule:
    - cron: '0 0,13 * * *'  # UTC 00:00 (HKT 08:00 港股开盘前) + UTC 13:00 (HKT 21:00 美股盘中)
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/update.yml"
      - "monitor_hk_disclosures.py"
      - "hk_disclosures.py"
      - "investors.json"
      - "tests/test_hk_automation.py"
      - "fetch_13f_all.py"
      - "sec_history_index.py"
      - "tests/test_sec_history_index.py"
      - "tests/test_hk_disclosure_evidence.py"
      - "tests/test_history_backfill.py"
      - "spinoff_price_refresh.py"
      - "tests/test_spinoff_prices.py"
      - "spinoff_events.py"
      - "resolve_spinoff_names.py"
      - "fetch_spinoff_us.py"
      - "tests/test_sec_primary.py"
      - "tests/test_spinoff_events.py"

concurrency:
  group: update-13f-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TRACK_RUN_STATUS: "1"
      # AI runs independently; source collection never waits for inference.
      SILICONFLOW_KEY: ""
    steps:
      # Use the per-run repository token; an expired PAT must not stop updates.
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pdfminer.six rapidfuzz beautifulsoup4

      - name: Test data update regressions
        env:
          TRACK_RUN_STATUS: "0"
        run: python3 -m unittest discover -s tests -v

      # ── 初始化本次运行状态记录 ──
      - name: Init run status
        id: init_status
        run: |
          python3 update_status.py --init --trigger "${{ github.event_name }}"

      - name: Verify HKEX disclosures (all configured investors)
        id: hk_disclosures
        continue-on-error: true
        run: python3 -u monitor_hk_disclosures.py

      - name: Status - HK disclosures
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.hk_disclosures.outcome }}" = "success" ]; then
            python3 update_status.py --step hk_disclosures --status ok
          else
            python3 update_status.py --step hk_disclosures --status fail --msg "Step exited with error"
          fi

      # ─────────────── 13F 数据抓取 ───────────────

      - name: Fetch Li Lu 13F from SEC EDGAR
        id: lilu_13f
        continue-on-error: true
        run: python3 fetch_13f_all.py --investor lilu

      - name: Status - Li Lu 13F
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.lilu_13f.outcome }}" = "success" ]; then
            python3 update_status.py --step lilu_13f --status ok
          else
            python3 update_status.py --step lilu_13f --status fail --msg "Step exited with error"
          fi

      - name: Fetch Pabrai 13F from SEC EDGAR
        id: pabrai_13f
        continue-on-error: true
        run: python3 fetch_13f_all.py --investor pabrai

      - name: Status - Pabrai 13F
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.pabrai_13f.outcome }}" = "success" ]; then
            python3 update_status.py --step pabrai_13f --status ok
          else
            python3 update_status.py --step pabrai_13f --status fail --msg "Step exited with error"
          fi

      - name: Fetch Duan Yongping 13F from SEC EDGAR
        id: duan_13f
        continue-on-error: true
        run: python3 fetch_13f_all.py --investor duan

      - name: Status - Duan 13F
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.duan_13f.outcome }}" = "success" ]; then
            python3 update_status.py --step duan_13f --status ok
          else
            python3 update_status.py --step duan_13f --status fail --msg "Step exited with error"
          fi

      - name: Fetch David Tepper 13F from SEC EDGAR
        id: tepper_13f
        continue-on-error: true
        run: python3 fetch_13f_all.py --investor tepper

      - name: Status - Tepper 13F
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.tepper_13f.outcome }}" = "success" ]; then
            python3 update_status.py --step tepper_13f --status ok
          else
            python3 update_status.py --step tepper_13f --status fail --msg "Step exited with error"
          fi

      - name: Fetch Buffett 13F from SEC EDGAR
        id: buffett_13f
        continue-on-error: true
        run: python3 fetch_13f_all.py --investor buffett

      - name: Status - Buffett 13F
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.buffett_13f.outcome }}" = "success" ]; then
            python3 update_status.py --step buffett_13f --status ok
          else
            python3 update_status.py --step buffett_13f --status fail --msg "Step exited with error"
          fi

      - name: Fetch Akre 13F from SEC EDGAR
        id: akre_greenberg_13f
        continue-on-error: true
        run: |
          python3 fetch_13f_all.py --investor akre
          python3 fetch_13f_all.py --investor greenberg

      - name: Status - Akre/Greenberg 13F
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.akre_greenberg_13f.outcome }}" = "success" ]; then
            python3 update_status.py --step akre_greenberg_13f --status ok
          else
            python3 update_status.py --step akre_greenberg_13f --status fail --msg "Step exited with error"
          fi

      - name: Fetch Klarman/Ackman/Abrams/Berkowitz/Hawkins 13F from SEC EDGAR
        id: batch2_13f
        continue-on-error: true
        run: |
          python3 fetch_13f_all.py --investor klarman
          python3 fetch_13f_all.py --investor ackman
          python3 fetch_13f_all.py --investor abrams
          python3 fetch_13f_all.py --investor berkowitz
          python3 fetch_13f_all.py --investor hawkins

      - name: Status - Batch2 13F
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.batch2_13f.outcome }}" = "success" ]; then
            python3 update_status.py --step batch2_13f --status ok
          else
            python3 update_status.py --step batch2_13f --status fail --msg "Step exited with error"
          fi

      # ─────────────── 股价抓取（使用通用脚本）───────────────

      - name: Fetch Li Lu stock prices
        id: lilu_prices
        continue-on-error: true
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python3 fetch_prices_all.py --investor lilu

      - name: Status - Li Lu prices
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.lilu_prices.outcome }}" = "success" ]; then
            python3 update_status.py --step lilu_prices --status ok
          else
            python3 update_status.py --step lilu_prices --status fail --msg "Step exited with error"
          fi

      - name: Fetch Pabrai stock prices
        id: pabrai_prices
        continue-on-error: true
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python3 fetch_prices_all.py --investor pabrai

      - name: Status - Pabrai prices
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.pabrai_prices.outcome }}" = "success" ]; then
            python3 update_status.py --step pabrai_prices --status ok
          else
            python3 update_status.py --step pabrai_prices --status fail --msg "Step exited with error"
          fi

      - name: Fetch Duan Yongping stock prices
        id: duan_prices
        continue-on-error: true
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python3 fetch_prices_all.py --investor duan

      - name: Status - Duan prices
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.duan_prices.outcome }}" = "success" ]; then
            python3 update_status.py --step duan_prices --status ok
          else
            python3 update_status.py --step duan_prices --status fail --msg "Step exited with error"
          fi

      - name: Fetch David Tepper stock prices
        id: tepper_prices
        continue-on-error: true
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python3 fetch_prices_all.py --investor tepper

      - name: Status - Tepper prices
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.tepper_prices.outcome }}" = "success" ]; then
            python3 update_status.py --step tepper_prices --status ok
          else
            python3 update_status.py --step tepper_prices --status fail --msg "Step exited with error"
          fi

      - name: Fetch David Webb stock prices
        id: webb_prices
        continue-on-error: true
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python3 fetch_prices_all.py --investor webb

      - name: Status - Webb prices
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.webb_prices.outcome }}" = "success" ]; then
            python3 update_status.py --step webb_prices --status ok
          else
            python3 update_status.py --step webb_prices --status fail --msg "Step exited with error"
          fi

      - name: Fetch Buffett stock prices
        id: buffett_prices
        continue-on-error: true
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python3 fetch_prices_all.py --investor buffett

      - name: Status - Buffett prices
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.buffett_prices.outcome }}" = "success" ]; then
            python3 update_status.py --step buffett_prices --status ok
          else
            python3 update_status.py --step buffett_prices --status fail --msg "Step exited with error"
          fi

      - name: Fetch Akre stock prices
        id: akre_prices
        continue-on-error: true
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python3 fetch_prices_all.py --investor akre

      - name: Status - Akre prices
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.akre_prices.outcome }}" = "success" ]; then
            python3 update_status.py --step akre_prices --status ok
          else
            python3 update_status.py --step akre_prices --status fail --msg "Step exited with error"
          fi

      - name: Fetch Greenberg stock prices
        id: greenberg_prices
        continue-on-error: true
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python3 fetch_prices_all.py --investor greenberg

      - name: Status - Greenberg prices
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.greenberg_prices.outcome }}" = "success" ]; then
            python3 update_status.py --step greenberg_prices --status ok
          else
            python3 update_status.py --step greenberg_prices --status fail --msg "Step exited with error"
          fi

      - name: Fetch Klarman stock prices
        id: klarman_prices
        continue-on-error: true
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python3 fetch_prices_all.py --investor klarman

      - name: Status - Klarman prices
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.klarman_prices.outcome }}" = "success" ]; then
            python3 update_status.py --step klarman_prices --status ok
          else
            python3 update_status.py --step klarman_prices --status fail --msg "Step exited with error"
          fi

      - name: Fetch Ackman stock prices
        id: ackman_prices
        continue-on-error: true
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python3 fetch_prices_all.py --investor ackman

      - name: Status - Ackman prices
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.ackman_prices.outcome }}" = "success" ]; then
            python3 update_status.py --step ackman_prices --status ok
          else
            python3 update_status.py --step ackman_prices --status fail --msg "Step exited with error"
          fi

      - name: Fetch Abrams stock prices
        id: abrams_prices
        continue-on-error: true
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python3 fetch_prices_all.py --investor abrams

      - name: Status - Abrams prices
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.abrams_prices.outcome }}" = "success" ]; then
            python3 update_status.py --step abrams_prices --status ok
          else
            python3 update_status.py --step abrams_prices --status fail --msg "Step exited with error"
          fi

      - name: Fetch Berkowitz stock prices
        id: berkowitz_prices
        continue-on-error: true
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python3 fetch_prices_all.py --investor berkowitz

      - name: Status - Berkowitz prices
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.berkowitz_prices.outcome }}" = "success" ]; then
            python3 update_status.py --step berkowitz_prices --status ok
          else
            python3 update_status.py --step berkowitz_prices --status fail --msg "Step exited with error"
          fi

      - name: Fetch Hawkins stock prices
        id: hawkins_prices
        continue-on-error: true
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python3 fetch_prices_all.py --investor hawkins

      - name: Status - Hawkins prices
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.hawkins_prices.outcome }}" = "success" ]; then
            python3 update_status.py --step hawkins_prices --status ok
          else
            python3 update_status.py --step hawkins_prices --status fail --msg "Step exited with error"
          fi

      # ─────────────── Webb 港股持仓（仅周一）───────────────

      - name: Fetch David Webb HK holdings (仅周一)
        id: webb_holdings
        continue-on-error: true
        run: |
          DAY=$(date -u +%u)
          if [ "$DAY" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "周一，执行 Webb 持仓抓取..."
            python3 fetch_webb_holdings.py
          else
            echo "今天是周 $DAY，跳过 Webb 持仓抓取"
            exit 0
          fi

      - name: Status - Webb holdings
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          DAY=$(date -u +%u)
          if [ "$DAY" != "1" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            python3 update_status.py --step webb_holdings --status skip --msg "非周一，跳过"
          elif [ "${{ steps.webb_holdings.outcome }}" = "success" ]; then
            python3 update_status.py --step webb_holdings --status ok
          else
            python3 update_status.py --step webb_holdings --status fail --msg "Step exited with error"
          fi

      # ─────────────── 元数据 & 分拆 ───────────────

      - name: Resolve unmapped tickers via CUSIP (OpenFIGI)
        id: resolve_cusip
        continue-on-error: true
        run: python3 resolve_unmapped_tickers.py

      - name: Status - Resolve unmapped tickers
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.resolve_cusip.outcome }}" = "success" ]; then
            python3 update_status.py --step resolve_cusip --status ok
          else
            python3 update_status.py --step resolve_cusip --status fail --msg "Step exited with error"
          fi

      - name: Enrich metadata (cnName + sector)
        id: metadata
        continue-on-error: true
        run: |
          python3 enrich_metadata.py

      - name: Status - Metadata
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.metadata.outcome }}" = "success" ]; then
            python3 update_status.py --step metadata --status ok
          else
            python3 update_status.py --step metadata --status fail --msg "Step exited with error"
          fi

      - name: Fetch HK spin-off announcements
        id: spinoff_hk
        continue-on-error: true
        run: |
          python3 fetch_spinoff.py

      - name: Status - HK spinoff
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.spinoff_hk.outcome }}" = "success" ]; then
            python3 update_status.py --step spinoff_hk --status ok
          else
            python3 update_status.py --step spinoff_hk --status fail --msg "Step exited with error"
          fi

      - name: Fetch US spin-off announcements (SEC EDGAR)
        id: spinoff_us
        continue-on-error: true
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: |
          python3 fetch_spinoff_us.py

      - name: Status - US spinoff
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.spinoff_us.outcome }}" = "success" ]; then
            python3 update_status.py --step spinoff_us --status ok
          else
            python3 update_status.py --step spinoff_us --status fail --msg "Step exited with error"
          fi
      - name: Refresh HK/US spinoff child company prices
        id: spinoff_prices
        continue-on-error: true
        run: |
          pip install rapidfuzz openpyxl akshare -q
          python3 spinoff_price_refresh.py

      - name: Status - Spinoff prices
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.spinoff_prices.outcome }}" = "success" ]; then
            python3 update_status.py --step spinoff_prices --status ok
          else
            python3 update_status.py --step spinoff_prices --status fail --msg "Step exited with error"
          fi

      - name: Generate Greenblatt spinoff notes
        id: greenblatt_notes
        continue-on-error: true
        run: |
          python3 -c "from enrich_metadata import _gen_spinoff_verdicts; _gen_spinoff_verdicts()"

      - name: Status - Greenblatt notes
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.greenblatt_notes.outcome }}" = "success" ]; then
            python3 update_status.py --step greenblatt_notes --status ok
          else
            python3 update_status.py --step greenblatt_notes --status fail --msg "Step exited with error"
          fi



      # ─────────────── JSON 验证 & 提交 ───────────────

      - name: Recover spin-off identities and normalize change history
        run: |
          python3 resolve_spinoff_names.py
          python3 spinoff_events.py

      - name: Finish run status
        run: python3 update_status.py --finish

      - name: Validate JSON files before commit
        run: python3 validate_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 validate_data.py --stage
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: update 13F data & prices (all investors)"
            # 拉取远端变更，对 prices*.json 用 ours 策略（CI计算结果优先），其余文件正常merge
            git fetch origin master
            git merge origin/master --no-edit -X ours
            python3 validate_data.py
            git push
            echo "Changes pushed!"
          fi


