name: Update 13F Data

on:
  schedule:
    - cron: '0 0,13 * * *'  # UTC 00:00 (HKT 08:00 港股开盘前) + UTC 13:00 (HKT 21:00 美股盘中)
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/update.yml"
      - "monitor_hk_disclosures.py"
      - "hk_disclosures.py"
      - "hk_financial_evidence.py"
      - "holdings_diff.py"
      - "fetch_prices_all.py"
      - "quote_coverage.py"
      - "security_lifecycle.py"
      - "security_lifecycle.json"
      - "fetch_webb_holdings.py"
      - "tests/test_cost_calculation.py"
      - "portfolio_review.py"
      - "ai_supplement.py"
      - "tab_insights.py"
      - "portfolio_briefing.py"
      - "tests/test_portfolio_briefing.py"
      - "tests/test_tab_insights.py"
      - "tests/test_portfolio_review.py"
      - "tests/test_hk_financial_evidence.py"
      - "investors.json"
      - "tests/test_hk_automation.py"
      - "tests/test_archived_holdings.py"
      - "fetch_13f_all.py"
      - "legacy_13f.py"
      - "batch_market_data.py"
      - "listing_metadata.py"
      - "fetch_public_projects.py"
      - "update_investors.py"
      - "tests/test_new_investors.py"
      - "reporting_scope.py"
      - "update_source_guard.py"
      - "resolve_unmapped_tickers.py"
      - "publish_update_failure.py"
      - "update_status.py"
      - "validate_data.py"
      - "tests/test_update_recovery.py"
      - "sec_history_index.py"
      - "audit_13f_history.py"
      - "tests/test_value_audit.py"
      - "tests/test_listing_completion.py"
      - "hk_listing_completion.py"
      - "tests/test_sec_history_index.py"
      - "tests/test_hk_disclosure_evidence.py"
      - "tests/test_history_backfill.py"
      - "spinoff_price_refresh.py"
      - "tests/test_spinoff_prices.py"
      - "spinoff_events.py"
      - "spinoff_identity.py"
      - "resolve_spinoff_names.py"
      - "fetch_spinoff_us.py"
      - "fetch_spinoff.py"
      - "tests/test_sec_primary.py"
      - "tests/test_spinoff_events.py"

concurrency:
  group: update-13f-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TRACK_RUN_STATUS: "1"
      # AI runs independently; source collection never waits for inference.
      SILICONFLOW_KEY: ""
    steps:
      # Use the per-run repository token; an expired PAT must not stop updates.
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: ${{ github.ref_name }}

      - name: Record source rules used by this run
        run: echo "TRACKER_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pdfminer.six rapidfuzz beautifulsoup4

      - name: Test data update regressions
        env:
          TRACK_RUN_STATUS: "0"
        run: python3 -m unittest discover -s tests -v

      # ── 初始化本次运行状态记录 ──
      - name: Init run status
        id: init_status
        run: |
          python3 update_status.py --init --trigger "${{ github.event_name }}"

      - name: Verify HKEX disclosures (all configured investors)
        id: hk_disclosures
        continue-on-error: true
        run: |
          python3 -u monitor_hk_disclosures.py
          python3 -u hk_financial_evidence.py

      - name: Status - HK disclosures
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.hk_disclosures.outcome }}" = "success" ]; then
            python3 update_status.py --step hk_disclosures --status ok
          else
            python3 update_status.py --step hk_disclosures --status fail --msg "Step exited with error"
          fi

      # The registry routes quarterly filings, archived HK disclosures and VC projects.
      # Adding an investor automatically schedules its supported source and price jobs.
      - name: Refresh every configured investor and market prices
        id: configured_investors
        continue-on-error: true
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python3 -u update_investors.py

      # ─────────────── 元数据 & 分拆 ───────────────

      - name: Resolve unmapped tickers via CUSIP (OpenFIGI)
        id: resolve_cusip
        continue-on-error: true
        run: python3 resolve_unmapped_tickers.py --active-only

      - name: Status - Resolve unmapped tickers
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.resolve_cusip.outcome }}" = "success" ]; then
            python3 update_status.py --step resolve_cusip --status ok
          else
            python3 update_status.py --step resolve_cusip --status fail --msg "Step exited with error"
          fi

      - name: Enrich metadata (cnName + sector)
        id: metadata
        continue-on-error: true
        run: |
          python3 enrich_metadata.py

      - name: Status - Metadata
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.metadata.outcome }}" = "success" ]; then
            python3 update_status.py --step metadata --status ok
          else
            python3 update_status.py --step metadata --status fail --msg "Step exited with error"
          fi

      - name: Fetch HK spin-off announcements
        id: spinoff_hk
        continue-on-error: true
        run: |
          python3 fetch_spinoff.py

      - name: Status - HK spinoff
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.spinoff_hk.outcome }}" = "success" ]; then
            python3 update_status.py --step spinoff_hk --status ok
          else
            python3 update_status.py --step spinoff_hk --status fail --msg "Step exited with error"
          fi

      - name: Fetch US spin-off announcements (SEC EDGAR)
        id: spinoff_us
        continue-on-error: true
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: |
          python3 fetch_spinoff_us.py

      - name: Status - US spinoff
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.spinoff_us.outcome }}" = "success" ]; then
            python3 update_status.py --step spinoff_us --status ok
          else
            python3 update_status.py --step spinoff_us --status fail --msg "Step exited with error"
          fi
      - name: Follow listings and in-specie distributions to actual completion
        run: python3 -u hk_listing_completion.py --limit 3

      - name: Refresh HK/US spinoff child company prices
        id: spinoff_prices
        continue-on-error: true
        run: |
          pip install rapidfuzz openpyxl akshare -q
          python3 spinoff_price_refresh.py

      - name: Status - Spinoff prices
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.spinoff_prices.outcome }}" = "success" ]; then
            python3 update_status.py --step spinoff_prices --status ok
          else
            python3 update_status.py --step spinoff_prices --status fail --msg "Step exited with error"
          fi

      - name: Generate Greenblatt spinoff notes
        id: greenblatt_notes
        continue-on-error: true
        run: |
          python3 -c "from enrich_metadata import _gen_spinoff_verdicts; _gen_spinoff_verdicts()"

      - name: Status - Greenblatt notes
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.greenblatt_notes.outcome }}" = "success" ]; then
            python3 update_status.py --step greenblatt_notes --status ok
          else
            python3 update_status.py --step greenblatt_notes --status fail --msg "Step exited with error"
          fi



      # ─────────────── JSON 验证 & 提交 ───────────────

      - name: Recover spin-off identities and normalize change history
        run: |
          python3 resolve_spinoff_names.py
          python3 spinoff_events.py
          python3 ai_supplement.py --refresh-fallbacks

      - name: Validate JSON files before commit
        id: validate_data
        run: |
          python3 quote_coverage.py
          python3 validate_data.py

      - name: Finish run status including validation outcome
        if: ${{ !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          if [ "${{ steps.validate_data.outcome }}" = "success" ]; then
            python3 update_status.py --step validation --status ok
          elif [ "${{ steps.validate_data.outcome }}" = "failure" ]; then
            python3 update_status.py --step validation --status fail --msg "数据校验失败，未发布本次数据；保留上一次有效数据。详情见 GitHub Actions 日志。"
          else
            python3 update_status.py --step pipeline --status fail --msg "更新流程未完成，未发布本次数据；保留上一次有效数据。"
          fi
          python3 update_status.py --finish

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          source_guard=0
          python3 update_source_guard.py "$TRACKER_SOURCE_SHA" origin/master || source_guard=$?
          if [ "$source_guard" -gt 1 ]; then exit "$source_guard"; fi
          if [ "$source_guard" -eq 1 ]; then
            echo "::notice::Source rules changed during this run; the queued fresh run will publish updated data."
            exit 0
          fi
          python3 validate_data.py --stage
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: update 13F data & prices (all investors)"
            # 拉取远端变更，对 prices*.json 用 ours 策略（CI计算结果优先），其余文件正常merge
            git fetch origin master
            git merge origin/master --no-edit -X ours
            python3 ai_supplement.py --refresh-fallbacks
            python3 validate_data.py --stage
            if ! git diff --cached --quiet; then git commit -m "auto: bind summaries to merged source data"; fi
            git push
            echo "Changes pushed!"
          fi

      - name: Report failed publication without releasing unvalidated data
        if: ${{ failure() && !cancelled() && steps.init_status.outcome == 'success' }}
        run: |
          python3 update_status.py --step publication --status fail --msg "本次更新未发布；线上保留上一次有效数据。"
          python3 update_status.py --finish
          python3 publish_update_failure.py

      - name: Retain failure status for diagnosis
        if: ${{ failure() && steps.init_status.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: failed-update-status
          path: run_status.json
          retention-days: 14


