name: Update Speech Archive
on:
  schedule:
    - cron: '45 22 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - speech_archive.py
      - verbatim_texts.py
      - archive/sources.json
      - tests/test_speech_archive.py
      - tests/test_verbatim_texts.py
      - .github/workflows/speech-archive.yml
permissions:
  contents: read
concurrency:
  group: speech-archive-master
  cancel-in-progress: true
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalogue readers
        run: python3 -m pip install beautifulsoup4==4.14.2 pymupdf==1.28.2
      - name: Test original text integrity and catalogue identity
        run: |
          python3 -m unittest discover -s tests -p test_speech_archive.py -v
          python3 -m unittest discover -s tests -p test_verbatim_texts.py -v
      - name: Discover document metadata only
        timeout-minutes: 10
        run: python3 -u speech_archive.py discover
      - name: Validate complete texts
        run: python3 speech_archive.py validate
      - name: Publish catalogue metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add archive/catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'auto: refresh original-document catalogue metadata'
          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin HEAD:master; then exit 0; fi
          done
          exit 1
