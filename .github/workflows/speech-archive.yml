name: Update Speech Archive
on:
  schedule:
    - cron: '45 22 * * *'
    - cron: '45 6,14 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - speech_archive.py
      - verbatim_texts.py
      - archive_guides.py
      - archive_explanations.py
      - investors.json
      - archive/explanation_baselines.json
      - archive/sources.json
      - tests/test_speech_archive.py
      - tests/test_verbatim_texts.py
      - tests/test_archive_explanations.py
      - .github/workflows/speech-archive.yml
permissions:
  contents: read
concurrency:
  group: speech-archive-master
  cancel-in-progress: true
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: write
    env:
      AI_MODEL: qwen3.5:9b-q4_K_M
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NO_CLOUD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalogue readers
        run: python3 -m pip install beautifulsoup4==4.14.2 pymupdf==1.28.2 yt-dlp==2026.8.19
      - name: Test original text integrity and catalogue identity
        run: |
          python3 -m unittest discover -s tests -p test_speech_archive.py -v
          python3 -m unittest discover -s tests -p test_verbatim_texts.py -v
          python3 -m unittest discover -s tests -p test_archive_explanations.py -v
      - name: Discover document metadata only
        timeout-minutes: 10
        run: python3 -u speech_archive.py discover
      - name: Validate complete texts
        run: python3 speech_archive.py validate
      - name: Plan detailed introductions
        id: plan
        run: |
          python3 archive_explanations.py plan > "$RUNNER_TEMP/archive-plan.json"
          python3 -c 'import json,os; n=json.load(open(os.environ["RUNNER_TEMP"]+"/archive-plan.json"))["pending"]; open(os.environ["GITHUB_OUTPUT"],"a").write("pending="+str(n)+"\n")'
          echo "OLLAMA_MODELS=$RUNNER_TEMP/lilu-ollama-models" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: steps.plan.outputs.pending != '0'
        with:
          path: ${{ env.OLLAMA_MODELS }}
          key: qwen-cpu-v1-${{ runner.os }}-${{ env.AI_MODEL }}
      - name: Install local CPU model
        id: model
        if: steps.plan.outputs.pending != '0'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          curl --fail --location --retry 3 --max-time 420 https://github.com/ollama/ollama/releases/download/v0.34.1/ollama-linux-amd64.tar.zst -o "$RUNNER_TEMP/archive-ollama.tar.zst"
          mkdir -p "$RUNNER_TEMP/archive-ollama"
          tar --zstd -xf "$RUNNER_TEMP/archive-ollama.tar.zst" -C "$RUNNER_TEMP/archive-ollama"
          export PATH="$RUNNER_TEMP/archive-ollama/bin:$PATH"
          echo "$RUNNER_TEMP/archive-ollama/bin" >> "$GITHUB_PATH"
          ollama serve > "$RUNNER_TEMP/archive-ollama.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version; then break; fi
            sleep 1
          done
          ollama pull "$AI_MODEL"
      - name: Generate source-grounded introductions with checkpoints
        if: steps.model.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 47
        run: python3 -u archive_explanations.py generate --model "$AI_MODEL" --limit 14 --minutes 45
      - name: Validate detailed guides and introductions
        run: |
          python3 archive_guides.py
          python3 archive_explanations.py validate
      - name: Publish catalogue metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add archive/catalog.json archive/guides.json archive/explanations
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'auto: refresh sources and detailed AI reading guides'
          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin HEAD:master; then exit 0; fi
          done
          exit 1
